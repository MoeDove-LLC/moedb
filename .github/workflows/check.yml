name: Check RPSL

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RADB_MAINTAINER: ${{ vars.RADB_MAINTAINER }}
    steps:
      - name: Checkout trusted checker
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          path: trusted
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Checkout submission
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          path: submission
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check submission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RADB_MAINTAINER" ]; then
            echo "RADB_MAINTAINER repository variable is required" >&2
            exit 1
          fi
          python trusted/scripts/check.py \
            --root "$GITHUB_WORKSPACE/submission" \
            --event "$GITHUB_EVENT_PATH"
