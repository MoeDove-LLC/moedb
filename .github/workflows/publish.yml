name: Publish RADB

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "!data/**/.gitkeep"
  workflow_dispatch:
    inputs:
      reconcile_path:
        description: Canonical data path of one approved object to reconcile
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: radb-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'MoeDove-LLC/moedb' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: radb-production
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Publish approved changes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          RECONCILE_PATH: ${{ inputs.reconcile_path }}
          RADB_MAINTAINER: ${{ secrets.RADB_MAINTAINER }}
          RADB_DELETE_REASON: ${{ secrets.RADB_DELETE_REASON }}
          RADB_PUBLISH_ENABLED: ${{ secrets.RADB_PUBLISH_ENABLED }}
          RADB_USERNAME: ${{ secrets.RADB_USERNAME }}
          RADB_ACCOUNT_PASSWORD: ${{ secrets.RADB_ACCOUNT_PASSWORD }}
          RADB_IRR_PASSWORD: ${{ secrets.RADB_IRR_PASSWORD }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/publish.py --reconcile-path "$RECONCILE_PATH"
          else
            python scripts/publish.py --before "$BEFORE_SHA" --after "$AFTER_SHA"
          fi
